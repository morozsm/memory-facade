[project]
name = "memory-facade"
version = "0.1.0"
description = "Thin stateless MCP curation layer over Hindsight + LightRAG for shared agent memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
memory-facade = "mf.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
